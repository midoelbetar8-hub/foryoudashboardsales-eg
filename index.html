<head>

<style>
:root{--bg:#f3f4f6;--card:#fff;--soft:#f9fafb;--bd:#e5e7eb;--tx:#1f2937;--mu:#6b7280;--pri:#2d3748;--bar1:#374151;--bar2:#9ca3af;--bar3:#4b5563;--bad:#991b1b;--badbg:#fee2e2;--wr:#92400e;--wrbg:#fef3c7;--ok:#166534;--okbg:#dcfce7;

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--soft:#273241;--bd:#374151;--tx:#f3f4f6;--mu:#9ca3af;--pri:#e5e7eb;--bar1:#d1d5db;--bar2:#6b7280;--bar3:#9ca3af;--bad:#fecaca;--badbg:#7f1d1d;--wr:#fde68a;--wrbg:#78350f;--ok:#bbf7d0;--okbg:#14532d}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--soft:#273241;--bd:#374151;--tx:#f3f4f6;--mu:#9ca3af;--pri:#e5e7eb;--bar1:#d1d5db;--bar2:#6b7280;--bar3:#9ca3af;--bad:#fecaca;--badbg:#7f1d1d;--wr:#fde68a;--wrbg:#78350f;--ok:#bbf7d0;--okbg:#14532d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:14px}
.w{max-width:1280px;margin:0 auto;padding:16px}
header{background:var(--pri);color:#fff;border-radius:14px;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px #0002}
:root[data-theme="dark"] header{color:#111827}
header h1{margin:0;font-size:30px;letter-spacing:3px;font-weight:800}header p{margin:4px 0 0;opacity:.8}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;box-shadow:0 1px 3px #0000000d}
h2{font-size:16px;margin:0 0 10px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:end}
.ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kp .card b{display:block;font-size:22px;margin-top:4px}.kp small{color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}
.sc{max-height:520px;overflow:auto}
.it{padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer}.it:hover{background:var(--soft)}
.nm{font-weight:600;display:block;overflow-wrap:anywhere}.sb{color:var(--mu);font-size:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.br{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--mu)}.br i{display:block;height:7px;border-radius:4px;min-width:2px}.br em{font-style:normal;white-space:nowrap}
.bd{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
.bad{background:var(--badbg);color:var(--bad)}.wr{background:var(--wrbg);color:var(--wr)}.ok{background:var(--okbg);color:var(--ok)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{background:var(--soft);position:sticky;top:0;font-size:12px}
td.n{max-width:300px;white-space:normal}tr[data-i]{cursor:pointer}tr[data-i]:hover{background:var(--soft)}
.em{text-align:center;padding:40px;color:var(--mu)}
.sp{width:34px;height:34px;border:4px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}
#ov{position:fixed;inset:0;background:#0006;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#pn{position:fixed;top:0;bottom:0;left:0;width:min(440px,100%);background:var(--card);z-index:10;transform:translateX(-102%);transition:transform .3s;overflow:auto;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:4px 0 20px #0004}
body.o #ov{opacity:1;pointer-events:auto}body.o #pn{transform:none}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mg div{background:var(--soft);border-radius:8px;padding:8px}.mg small{color:var(--mu);display:block}.mg b{font-size:16px}
.dq li{margin:4px 0}.dq code{background:var(--soft);padding:1px 5px;border-radius:4px}

/* ===== mobile fixes ===== */
html{-webkit-text-size-adjust:100%}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.card,.g2>*{min-width:0}
input,select{font-size:16px}
.tw{-webkit-overflow-scrolling:touch}
@media(max-width:640px){
.w{padding:10px}
header{padding:16px;border-radius:12px}
header h1{font-size:22px;letter-spacing:2px}
header>div:last-child,header button{width:100%}
.ctl{gap:8px}
.ctl label{flex:1 1 calc(50% - 8px);min-width:130px}
.ctl label input:not([type=checkbox]),.ctl label select{width:100%}
.ctl label:first-child{flex-basis:100%}
.ctl button{flex:1 1 100%;padding:10px}
.kp{grid-template-columns:repeat(2,minmax(0,1fr))}
.kp .card b{font-size:18px}
.sc{max-height:420px}
.it{padding:10px 0}
table{min-width:900px}
td.n{min-width:200px;max-width:220px}
th:first-child,td:first-child{position:sticky;right:0;background:var(--card);box-shadow:-2px 0 4px #0000000d}
th:first-child{background:var(--soft);z-index:1}
#pn{padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.mg b{font-size:15px}
}
</style>
</head>

function dq(){const a=DATA,mv=a.filter(r=>Math.abs(r.sv-r.rv-r.nv)>.01),mq=a.filter(r=>r.sq-r.rq!==r.nq),neg=a.filter(r=>r.nv<0).length,zr=a.filter(r=>r.sv<=0&&r.rv>0).length,ns=a.filter(r=>!r.sup||!String(r.sup).trim()).length,dp=a.length-new Set(a.map(r=>r.name)).size;
const ok=!mv.length&&!mq.length;
return `<div class="card dq" style="margin-top:14px"><h2>ملخص جودة البيانات</h2><div class="${ok?'bd ok':'bd bad'}" style="padding:4px 12px">${ok?'أعمدة الصافي مطابقة للمعادلات (صافي = مبيعات − مرتجعات) في كل الصفوف':'تنبيه: يوجد اختلاف بين أعمدة الصافي والمعادلات - لم يتم تعديل أي بيانات'}</div><ul><li>المصدر: <code>${E(SRC)}</code> - ${F(a.length)} صف، ${F(new Set(a.map(r=>r.sup)).size)} مورد</li><li>اختلاف صافي القيمة: ${mv.length} صف${mv.length?' (مثال: '+E(mv[0].name)+')':''} | اختلاف صافي الكمية: ${mq.length} صف${mq.length?' (مثال: '+E(mq[0].name)+')':''}</li><li>منتجات بصافي سالب (مرتجعات أكبر من المبيعات): ${neg} | مرتجع بدون مبيعات: ${zr}</li><li>صفوف بلا مورد: ${ns} | أسماء مكررة: ${dp}</li><li>لا توجد تكاليف أو أرباح أو تواريخ أو فروع في الملف، ولذلك لا تظهر في اللوحة.</li></ul>
<details><summary><b>كيفية تحديث البيانات عند وصول تقرير جديد</b></summary><ol><li>اضغط <b>رفع تقرير Excel جديد</b> واختر الملف (الصفحة الأولى المسماة DATA أو أول ورقة).</li><li>يجب أن تحمل الأعمدة نفس العناوين: اسم صنف، ق . مبيعات، ق . مردود مبيعات، ك . مبيعات، ك . مردود مبيعات، ك . صافي مبيعات، ق. صافي مبيعات، رصيد حالي، اسم المورد. الترتيب غير مهم.</li><li>الرفع يغيّر العرض الحالي فقط. للتثبيت الدائم اطلب إعادة نشر اللوحة مع الملف الجديد.</li></ol></details></div>`}
function open(i){const r=DATA[i],T=sum(DATA,'nv'),av=r.nq>0?r.nv/r.nq:null;
const M=[['قيمة المبيعات',F2(r.sv)],['قيمة المرتجعات',F2(r.rv)],['صافي القيمة',F2(r.nv)],['نسبة المرتجعات',RT(r)],['كمية المبيعات',F(r.sq)],['كمية المرتجعات',F(r.rq)],['صافي الكمية',F(r.nq)],['الرصيد الحالي',F(r.stock)],['ترتيب المبيعات','#'+r.rank+' من '+F(DATA.length)],['حصته من صافي الإجمالي',T?(r.nv/T*100).toFixed(2)+'%':'-'],['متوسط صافي سعر القطعة',av===null?'-':F2(av)],['نسبة المرتجع بالكمية',r.sq>0?(r.rq/r.sq*100).toFixed(1)+'%':'-']];
$('#pn').innerHTML=`<button id="x" style="float:left">إغلاق ✕</button><h2 style="margin-top:34px;line-height:1.6">${E(r.name)}</h2><div class="sb">المورد: ${E(r.sup)}</div><div style="margin-top:8px">${bStk(r)} ${bRate(r)} ${r.low?'<span class="bd wr">يتطلب انتباه: مخزون منخفض</span>':''} ${r.hi?'<span class="bd bad">مرتجعات مرتفعة</span>':''}</div><div class="mg">${M.map(m=>`<div><small>${m[0]}</small><b>${m[1]}</b></div>`).join('')}</div>`;
document.body.classList.add('o');}
const close=()=>document.body.classList.remove('o');
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)open(+t.dataset.i);if(e.target.id==='ov'||e.target.id==='x')close()});
document.addEventListener('keydown',e=>e.key==='Escape'&&close());
const bind=(id,k,fn=v=>v,ev='input')=>$(id).addEventListener(ev,e=>{st[k]=fn(e.target.type==='checkbox'?e.target.checked:e.target.value);render()});
bind('#q','q');bind('#sup','sup',v=>v,'change');bind('#lim','lim',Number,'change');bind('#sort','sort',v=>v,'change');bind('#stk','stk',v=>v,'change');bind('#hi','hi',v=>v,'change');
$('#rs').onclick=()=>{Object.assign(st,{q:'',sup:'',lim:10,sort:'nv',stk:'',hi:false});$('#q').value='';$('#sup').value='';$('#lim').value=10;$('#sort').value='nv';$('#stk').value='';$('#hi').checked=false;render()};
$('#up').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#app').innerHTML='<div class="em"><div class="sp"></div>جاري قراءة الملف...</div>';
try{const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames.includes('DATA')?'DATA':wb.SheetNames[0]],{defval:0});
const M={اسمصنف:'name',قمبيعات:'sv',قمردودمبيعات:'rv',كمبيعات:'sq',كمردودمبيعات:'rq',كصافيمبيعات:'nq',قصافيمبيعات:'nv',رصيدحالي:'stock',اسمالمورد:'sup'};
const out=rows.map(o=>{const r={};for(const k in o){const m=M[k.replace(/[\s.]/g,'')];if(m)r[m]=o[k]}return r}).filter(r=>r.name);
if(!out.length||Object.keys(out[0]).length<9)throw 0;
out.forEach(r=>{['sv','rv','sq','rq','nq','nv','stock'].forEach(k=>r[k]=+r[k]||0);r.name=String(r.name).trim();r.sup=String(r.sup||'').trim()});
DATA=out;SRC=f.name;prep();$('#rs').click();$('#sub').textContent='المصدر: '+SRC}
catch(_){$('#app').innerHTML='<div class="em card">تعذّرت قراءة الملف: تأكد من وجود الأعمدة التسعة بنفس العناوين.</div>'}
e.target.value=''};
setTimeout(()=>{prep();$('#sub').textContent='المصدر: '+SRC+' - '+F(DATA.length)+' منتج';render()},350);
</script>
</body></html>
